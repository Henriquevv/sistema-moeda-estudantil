name: Testes

# Roda a cada commit na main e em cada pull request para a main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/back/requirements-dev.txt
      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest -q

  front:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/front/package-lock.json
      - name: Instalar as dependências
        run: npm ci
      - name: Conferir o lint
        run: npm run lint
      - name: Conferir a formatação
        run: npm run formato:verificar
      - name: Rodar os testes
        run: npm test
      - name: Gerar o build
        run: npm run build

  render:
    name: Publicar na Render
    # Só publica em commits na main, depois que a API e o front passaram nos testes.
    needs: [api, front]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      URL_DA_API: https://moeda-estudantil-api-gmkt.onrender.com
    steps:
      - name: Disparar o deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta o segredo RENDER_DEPLOY_HOOK (endereço do Deploy Hook da Render)."
            exit 1
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" > /dev/null
          echo "Deploy do commit ${GITHUB_SHA} pedido à Render."
      - name: Esperar a API publicar este commit
        run: |
          for i in $(seq 1 60); do
            versao=$(curl -fsS -m 30 "$URL_DA_API/saude" 2>/dev/null | python3 -c "import sys, json; print(json.load(sys.stdin).get('versao', ''))" 2>/dev/null || true)
            echo "tentativa $i: versão publicada = ${versao:-sem resposta}"
            if [ "$versao" = "$GITHUB_SHA" ]; then
              echo "A API está publicada no commit ${GITHUB_SHA}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::A API não publicou o commit ${GITHUB_SHA} a tempo."
          exit 1
