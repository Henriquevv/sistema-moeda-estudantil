name: Testes

# Roda a cada commit na main e em cada pull request para a main.
# Quando passa na main, os workflows "Publicar na Render" e "Publicar na Vercel" entram em ação.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/back/requirements-dev.txt
      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt
      - name: Rodar os testes
        run: python -m pytest -q

  front:
    name: Front-end (lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/front/package-lock.json
      - name: Instalar as dependências
        run: npm ci
      - name: Conferir o lint
        run: npm run lint
      - name: Conferir a formatação
        run: npm run formato:verificar
      - name: Rodar os testes
        run: npm test
      - name: Gerar o build
        run: npm run build
