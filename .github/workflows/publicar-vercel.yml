name: Publicar na Vercel

# Entra em ação quando o workflow "Testes" termina com sucesso num commit da main.
on:
  workflow_run:
    workflows: ["Testes"]
    types: [completed]
    branches: [main]

jobs:
  vercel:
    name: Vercel
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      URL_DO_FRONT: https://sistema-moeda-estudantil-gold.vercel.app
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Disparar o deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Falta o segredo VERCEL_DEPLOY_HOOK (endereço do Deploy Hook da Vercel)."
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "Deploy pedido à Vercel."
      - name: Esperar o front publicar este commit
        run: |
          for i in $(seq 1 60); do
            versao=$(curl -fsS -m 30 "$URL_DO_FRONT/versao.json?t=$(date +%s)" 2>/dev/null | python3 -c "import sys, json; print(json.load(sys.stdin).get('versao', ''))" 2>/dev/null || true)
            echo "tentativa $i: versão publicada = ${versao:-sem resposta}"
            if [ "$versao" = "$COMMIT" ]; then
              echo "O front está publicado no commit ${COMMIT}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::O front não publicou o commit ${COMMIT} a tempo."
          exit 1
